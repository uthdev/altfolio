version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: altfolio-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: altfolio
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - altfolio-dev-network

  # Backend Server (Development)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: altfolio-server-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/altfolio?authSource=admin
      JWT_SECRET: your-super-secure-jwt-secret-key-at-least-32-characters-long
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - altfolio-dev-network
    volumes:
      - ./server:/app
      - /app/node_modules
    command: ["pnpm", "run", "dev"]

  # Frontend Client (Development)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: altfolio-client-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - altfolio-dev-network
    volumes:
      - ./client:/app
      - /app/node_modules
    command: ["pnpm", "run", "dev", "--host", "0.0.0.0"]

volumes:
  mongodb_dev_data:

networks:
  altfolio-dev-network:
    driver: bridge